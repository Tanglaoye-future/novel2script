scenes:
  - id: S001
    heading:
      int_ext: INT
      location_id: l01
      time_of_day: NIGHT
    source:
      chapter_index: 1
      chapter_title: 第一章
      paragraph_range: [0, 4]
    synopsis: 主角在月光下惊觉今夜"分外清醒"，回忆三十年来未见的月光。
    characters_present: [c01]
    beats:
      - type: action
        content: 月光透过窗纸落在主角床沿。主角缓缓坐起，瞪大双眼望向窗外。
      - type: voiceover
        character_id: c01
        content: 今天晚上，很好的月光。
        subtext: 这是"清醒"的开始，他第一次怀疑此前三十年的麻木。
      - type: action
        content: 主角下床，赤足走到窗前，伸手触碰冷窗棂。
      - type: dialogue
        character_id: c01
        parenthetical: (低声自语)
        content: 我不见他，已是三十多年；今天见了，精神分外爽快。
        subtext: 月光成为"觉醒"的隐喻，他自己尚未意识到这意味着什么。

  - id: S002
    heading:
      int_ext: EXT
      location_id: l02
      time_of_day: MORNING
    source:
      chapter_index: 2
      chapter_title: 第二章
      paragraph_range: [0, 8]
    synopsis: 清晨踏入院落，主角察觉赵贵翁等人的眼神异样，开始疑心被算计。
    characters_present: [c01]
    beats:
      - type: action
        content: 主角推门而出，廊下三五人立刻噤声，目光齐齐落在他身上。
      - type: dialogue
        character_id: c01
        parenthetical: (心中)
        content: 他们的眼色，全同别人不同。
        subtext: 偏执从此被点燃；亦是他读出"吃人"两字的前奏。

  - id: S003
    heading:
      int_ext: INT
      location_id: l01
      time_of_day: EVENING
    source:
      chapter_index: 3
      chapter_title: 第三章
      paragraph_range: [12, 30]
    synopsis: 何先生为主角把脉。主角看穿这是"试肉肥瘦"的伪装。
    characters_present: [c01, c02, c03]
    beats:
      - type: action
        content: 何先生指尖搭在主角腕上，眉头微皱。大哥站在床边，神色凝重。
      - type: dialogue
        character_id: c03
        content: 不要乱想。静静的养几天，就好了。
        subtext: 安抚的话术，在主角听来却是"养肥再吃"的暗号。
      - type: dialogue
        character_id: c01
        parenthetical: (盯着何先生)
        content: 你想吃我，还想叫别人也帮着吃我。
        subtext: 把幻觉与现实合一，是疯狂也是清醒。
      - type: dialogue
        character_id: c02
        parenthetical: (强作镇定)
        content: 这病要紧，不要胡说。
        subtext: 兄长的本能反应：先维护秩序，再处置异端。
      - type: transition
        content: 渐隐至黑。

