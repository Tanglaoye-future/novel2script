  synopsis: 海上浓雾骤起，整座岛被笼罩其中。
  characters_present:
  - c01
  - c02
  beats:
  - type: action
    content: 镜头从高空俯瞰海岛，浓雾如潮水般迅速漫延，吞噬了整座岛。塔顶的林海舟在窗边踱步，神情焦躁。
    subtext: null
  - type: action
    content: 远处传来汽笛声，一声、两声、三声，声音沉闷而厚重。
    subtext: null
  - type: action
    content: 林海舟冲到瞭望窗前，试图穿透浓雾，但什么也看不见。
    subtext: null
  - type: dialogue
    character_id: c01
    parenthetical: (急促)
    content: 陈未！
    subtext: 他需要帮助，感到不安。
  - type: dialogue
    character_id: c02
    parenthetical: ''
    content: 在！
    subtext: 回应坚定，随时待命。
  - type: action
    content: 陈未抱着第六罐煤油从塔下上来，脚步沉重。
    subtext: null
  notes: []
- id: S010
  heading:
    int_ext: EXT
    location_id: l01
    time_of_day: EVENING
