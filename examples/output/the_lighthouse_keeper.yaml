    content: 灯塔孤零零地立在岛的西北角，岩礁被海水侵蚀百年。林海舟走进塔内，熟练地操作开关。
    subtext: null
  - type: action
    content: 他将铜把手转到「亮」的位置，齿轮深处发出一声「咔」，光柱挣扎两秒，最终未亮。
    subtext: null
  - type: action
    content: 林海舟皱起眉，伸手检查开关，神情凝重。
    subtext: null
