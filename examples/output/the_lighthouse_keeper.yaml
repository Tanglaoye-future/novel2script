    content: 第一盏灯被点燃，火光在浓雾中微弱闪烁。
    subtext: null
  - type: voiceover
    character_id: c01
    content: 五盏，六盏，七盏……
    subtext: 他用数灯的方式缓解焦虑，也试图确认希望的存在。
  - type: action
    content: 汽笛声再次响起，比之前更近。
    subtext: null
  - type: action
    content: 灯光一盏接一盏亮起，火光在雾中摇曳，形成微弱的光弧。
