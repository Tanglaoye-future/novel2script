    - 1
  synopsis: 林海舟点上所有备用油灯，陈未默默观察他的举动。
  characters_present:
  - c01
  - c02
  beats:
  - type: action
    content: 灯塔内部，所有备用油灯都被点上，微弱的光晕映照出林海舟忙碌的身影。陈未坐在木箱上，注视着他。
    subtext: null
  - type: action
    content: 林海舟来回走动，仔细调整每一盏灯的角度。
    subtext: null
  notes: []
- id: S005
  heading:
    int_ext: INT
    location_id: l01
    time_of_day: NIGHT
  source:
    chapter_index: 3
    chapter_title: 第二章 沉默
    paragraph_range:
    - 2
    - 5
  synopsis: 陈未回忆起童年，提起林海舟过去的态度。
  characters_present:
  - c01
  - c02
  beats:
  - type: dialogue
    character_id: c02
    parenthetical: (忽然开口)
    content: 你以前不是这样的。
    subtext: 陈未试图打破沉默，试探林海舟态度的转变。
  - type: dialogue
    character_id: c01
    parenthetical: ''
    content: 以前怎样。
    subtext: 林海舟不愿回忆过去，语气冷淡。
  - type: dialogue
    character_id: c02
    parenthetical: ''
    content: 以前你不让人进塔。我十岁的时候来送过电报，你站在门口，连门都没让我进。
    subtext: 陈未想了解林海舟为何改变，也暗示自己多年来一直记得那次经历。
  notes: []
- id: S006
  heading:
    int_ext: INT
    location_id: l01
    time_of_day: NIGHT
  source:
    chapter_index: 3
    chapter_title: 第二章 沉默
    paragraph_range:
    - 6
    - 8
  synopsis: 林海舟停下动作，解释自己当年的冷漠。
  characters_present:
  - c01
  - c02
  beats:
  - type: action
    content: 林海舟终于停下动作，背对着陈未，沉默片刻。
    subtext: null
  - type: action
    content: 窗外的海浪拍打着岩礁，节奏缓慢而沉重。
    subtext: null
  - type: dialogue
    character_id: c01
    parenthetical: ''
    content: 那时候我妻子刚走。我谁也不想见。
    subtext: 林海舟在回忆伤痛，语气中透露出压抑的情感。
  notes: []
- id: S007
  heading:
    int_ext: INT
    location_id: l01
    time_of_day: NIGHT
  source:
    chapter_index: 3
    chapter_title: 第二章 沉默
    paragraph_range:
    - 9
    - 11
  synopsis: 林海舟交给陈未任务，准备休息。
  characters_present:
  - c01
  - c02
  beats:
  - type: action
    content: 林海舟回过身，从口袋里掏出一只旧怀表，放在陈未面前的木箱上。
    subtext: null
  - type: dialogue
    character_id: c01
    parenthetical: ''
    content: 替我盯着这个。每隔三分钟，把外面这盏灯调一下角度。我要去下面睡两个小时。
    subtext: 林海舟表现出对陈未的信任，但不愿多做解释。
  - type: action
    content: 陈未接过怀表，没有问为什么。
    subtext: null
  notes: []
- id: S008
  heading:
    int_ext: INT
    location_id: l01
    time_of_day: NIGHT
