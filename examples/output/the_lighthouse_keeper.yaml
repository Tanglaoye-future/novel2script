  synopsis: 林海舟前往镇上报务室发电报，得知备件需三天送达。
  characters_present:
  - c01
  - c02
  beats:
  - type: action
    content: 林海舟走进报务室，将电报稿推过柜台。
    subtext: null
  - type: dialogue
    character_id: c02
    parenthetical: (疑惑)
    content: 林叔，灯塔出了问题？
    subtext: 陈未察觉林海舟的异常，关心灯塔状况。
  - type: dialogue
    character_id: c01
    parenthetical: ''
    content: 齿轮。
    subtext: 林海舟不愿多说，只给出最简短的回答。
  - type: dialogue
    character_id: c02
    parenthetical: ''
    content: 备件你们这里有吗？
    subtext: 陈未试图帮助，但意识到问题的严重性。
  - type: dialogue
    character_id: c01
    parenthetical: ''
    content: 省城才有，最快得三天。
    subtext: 林海舟冷静地陈述事实，但内心已有担忧。
  - type: action
    content: 林海舟点头，转身要走。
    subtext: null
  - type: transition
    content: 画面切至林海舟。
    subtext: null
  notes: []
