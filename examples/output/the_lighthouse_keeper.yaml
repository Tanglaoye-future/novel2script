    - 5
  synopsis: 两人将所有灯具搬出，沿着礁石摆放。
  characters_present:
  - c01
  - c02
  beats:
  - type: dialogue
    character_id: c01
    parenthetical: ''
    content: 所有灯都拿出来。所有的。放到外面礁石上。一排。
    subtext: 他试图用灯光弥补灯塔的失灵，表现出一种不言弃的坚持。
  - type: action
    content: 陈未怔了一下，但没有多问，开始搬灯。
    subtext: null
  - type: action
    content: 两人将灯塔内能找到的所有油灯、马灯、提灯搬出，沿着礁石外缘排成一条弧线。
    subtext: null
  - type: action
    content: 林海舟搬下自己卧室里的油桶，补充燃料。
    subtext: null
  notes: []
