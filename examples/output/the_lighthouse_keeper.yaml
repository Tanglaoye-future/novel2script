    - 12
    - 14
  synopsis: 林海舟临走前道谢，陈未感到震惊。
  characters_present:
  - c01
  - c02
  beats:
  - type: dialogue
    character_id: c01
    parenthetical: ''
    content: 陈未。
    subtext: 林海舟犹豫片刻，才说出那两个字。
  - type: dialogue
    character_id: c02
    parenthetical: ''
    content: 嗯？
    subtext: 陈未察觉林海舟语气的变化，准备倾听。
  - type: dialogue
    character_id: c01
    parenthetical: ''
    content: 谢谢。
    subtext: 林海舟表达感激，也试图打破自己多年来的封闭。
  - type: action
    content: 陈未怔住，眼中闪过一丝震惊。那是他七年里第一次听林海舟说这两个字。
    subtext: null
  - type: transition
    character_id: null
    parenthetical: ''
    content: 渐隐至黑
    subtext: null
  notes: []
- id: S009
